services:
  postgres:
    image: postgres:16
    container_name: course_platform
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: education_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d education_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: